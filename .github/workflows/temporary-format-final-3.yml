name: Temporary format pass 3

on:
  push:
    branches:
      - verify/agent-file-workflow-final-3

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx prettier --write apps/desktop/electron/main.ts apps/desktop/electron/runtime.ts apps/desktop/src/main.tsx apps/desktop/src/api-client.ts packages/agent/manager.ts packages/agent/runtime.ts packages/database/connection.ts packages/database/repositories.ts packages/indexing/repository.ts packages/tools/change-service.ts packages/tools/changes.ts packages/tools/workspace.ts server.ts scripts/preflight-electron.ts tests/agent-file-workflow.test.ts tests/agent-runtime.test.ts tests/file-tools.test.ts tests/indexing.test.ts tests/security-hardening.test.ts tests/tool-arguments.test.ts
      - run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/desktop/electron/main.ts apps/desktop/electron/runtime.ts apps/desktop/src/main.tsx apps/desktop/src/api-client.ts packages/agent/manager.ts packages/agent/runtime.ts packages/database/connection.ts packages/database/repositories.ts packages/indexing/repository.ts packages/tools/change-service.ts packages/tools/changes.ts packages/tools/workspace.ts server.ts scripts/preflight-electron.ts tests/agent-file-workflow.test.ts tests/agent-runtime.test.ts tests/file-tools.test.ts tests/indexing.test.ts tests/security-hardening.test.ts tests/tool-arguments.test.ts
          git commit -m "style: format agent workflow changes"
          git push origin HEAD:${{ github.ref_name }}
