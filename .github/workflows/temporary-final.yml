name: Temporary final format

on:
  push:
    branches: [verify/final-ci-fix]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npx prettier --write packages/tools/changes.ts
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/tools/changes.ts
          git diff --cached --quiet || (git commit -m "style: format final change helper" && git push origin HEAD:${{ github.ref_name }})
