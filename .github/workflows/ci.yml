name: G1Code CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: g1code-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true
  npm_config_audit: false
  npm_config_fund: false

jobs:
  quality:
    name: Quality / unit + security tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # better-sqlite3 v13 (the database layer) requires Node >= 22 and
        # publishes no Node 20 prebuilds, so 22 is the real minimum.
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # Electron downloads are best-effort: the preflight reports whether the
      # binary is available without failing the unit-test job.
      - run: npm run preflight:electron
      - run: npm run typecheck
      - run: npm run format:check
      - name: Unit + integration tests
        run: |
          set -o pipefail
          npx tsx --test-reporter=tap --test tests/*.test.ts 2>&1 | tee /tmp/g1code-test.log
      - name: Publish test failures as annotations
        if: failure()
        run: npx tsx scripts/ci-test-annotations.ts /tmp/g1code-test.log
      - name: Security suites
        run: npm run test:security
      - run: npm run build
      - name: Electron smoke test (Linux, xvfb)
        if: matrix.node == 22
        run: xvfb-run -a npm run e2e:smoke

  integration:
    name: Headless E2E (${{ matrix.os }})
    needs: quality
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # No Electron binary and no network: a real backend, a temporary project,
      # and a local mock provider exercise the full agent workflow.
      - run: npm run e2e:backend

  desktop:
    name: Desktop E2E (electron)
    needs: integration
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run preflight:electron:strict
      - run: npm run build
      - run: xvfb-run -a npm run e2e:electron

  package:
    name: Package (${{ matrix.name }})
    needs: [integration]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-latest
            target: linux
            arch: x64
          - name: linux-arm64
            os: ubuntu-latest
            target: linux
            arch: arm64
          - name: macos-x64
            os: macos-26-intel
            target: mac
            arch: x64
          - name: macos-arm64
            os: macos-14
            target: mac
            arch: arm64
          - name: windows-x64
            os: windows-latest
            target: win
            arch: x64
          - name: windows-ia32
            os: windows-latest
            target: win
            arch: ia32
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run preflight:electron:strict
      - run: npm run build
      - run: npx electron-builder --${{ matrix.target }} --${{ matrix.arch }} -p never --config electron-builder.json
      - name: Verify package artifact
        shell: bash
        run: |
          set -euo pipefail
          test -d dist-release
          case "${{ matrix.target }}" in
            mac) test -n "$(find dist-release -maxdepth 1 -type f -name '*.dmg' -print -quit)" ;;
            win) test -n "$(find dist-release -maxdepth 1 -type f -name '*.exe' -print -quit)" ;;
            linux) test -n "$(find dist-release -maxdepth 1 -type f -name '*.AppImage' -print -quit)" ;;
          esac
          find dist-release -maxdepth 1 -type f -printf '%f\n' 2>/dev/null || ls -la dist-release
      - uses: actions/upload-artifact@v4
        with:
          name: G1Code-${{ matrix.name }}
          path: dist-release/*
          if-no-files-found: error
          retention-days: 7
