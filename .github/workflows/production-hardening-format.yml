name: Temporary production-hardening formatter

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format
      - name: Capture formatting patch
        run: git diff --no-color > /tmp/g1code-format.patch
      - uses: actions/upload-artifact@v4
        with:
          name: g1code-format-patch
          path: /tmp/g1code-format.patch
          retention-days: 1
