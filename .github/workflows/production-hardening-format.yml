name: Temporary production-hardening formatter

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format
      - name: Package formatted source
        run: tar -czf /tmp/g1code-formatted.tgz --exclude=.git --exclude=node_modules .
      - uses: actions/upload-artifact@v4
        with:
          name: g1code-formatted-source
          path: /tmp/g1code-formatted.tgz
          retention-days: 1
